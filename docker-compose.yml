services:
  postgres:
    container_name: hellion-postgres
    image: postgres:17
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 30

  nakama:
    container_name: hellion-nakama
    image: heroiclabs/nakama
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up
        --database.address postgres:password@postgres:5432/nakama &&
        exec /nakama/nakama
        --config config.yml
        --runtime.path /nakama/data/modules
        --runtime.js_entrypoint plugin.js
        --runtime.env "SERVER_IP_OVERRIDE=127.0.0.1"
        --database.address postgres:password@postgres:5432/nakama
    volumes:
      - ./modules:/nakama/data/modules
      - ./config.yml:/nakama/config.yml
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
