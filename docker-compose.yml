# Local main server for OpenHellion testing.
# Postgres + Nakama with the compiled plugin from ./modules mounted in.
# The game server expects Nakama on 127.0.0.1:7350 with http_key=defaulthttpkey
# (Nakama's default), which matches GameServer.ini.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hellion-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 30

  nakama:
    image: heroiclabs/nakama:latest
    container_name: hellion-nakama
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up
        --database.address postgres:password@postgres:5432/nakama &&
        exec /nakama/nakama
        --name nakama1
        --database.address postgres:password@postgres:5432/nakama
        --logger.level INFO
        --runtime.path /nakama/data/modules
        --runtime.js_entrypoint plugin.js
        --runtime.env "SERVER_IP_OVERRIDE=127.0.0.1"
    volumes:
      - ./modules:/nakama/data/modules
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
